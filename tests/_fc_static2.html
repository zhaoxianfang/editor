<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>fc static test 2 (editor defaults)</title>
<style>.flowchart { margin: 20px auto; }</style>
</head>
<body>
<div id="wrap" style="width:440px;margin:0 auto;"></div>
<script src="/lib/flowchart.bundle.min.js"></script>
<script>
var editorDefaults = {
    "x": 0, "y": 0, "line-width": 2, "line-length": 50, "text-margin": 10,
    "font-size": 14,
    "font-color": "#1f2937",
    "line-color": "#4b5563",
    "element-color": "#4b5563",
    "fill": "#ffffff",
    "yes-text": "yes", "no-text": "no",
    "arrow-end": "block",
    "symbols": {
        "start":      { "class": "start-element fc-type-start" },
        "end":        { "class": "end-element fc-type-end" },
        "operation":  { "class": "fc-type-operation" },
        "subroutine": { "class": "fc-type-subroutine" },
        "condition":  { "class": "fc-type-condition" },
        "inputoutput":{ "class": "fc-type-inputoutput" },
        "parallel":   { "class": "fc-type-parallel" },
        "input":      { "class": "fc-type-input" },
        "output":     { "class": "fc-type-output" }
    },
    "flowstate": {
        "past": { "fill": "#CCCCCC", "font-size": 12 },
        "current": { "fill": "black", "font-color": "white", "font-weight": "bold" },
        "future": { "fill": "white" },
        "request": { "fill": "blue" },
        "invalid": { "fill": "#444444" },
        "approved": { "fill": "#58C4A3", "font-size": 12, "yes-text": "APPROVED", "no-text": "n/a" },
        "rejected": { "fill": "#C45879", "font-size": 12, "yes-text": "n/a", "no-text": "REJECTED" }
    }
};
fetch('/examples/md/full.md').then(function(r){return r.text();}).then(function(md){
  var re = /```flow\s*\n([\s\S]*?)```/g, m, i = 0;
  while ((m = re.exec(md)) !== null) {
    i++;
    var div = document.createElement('div');
    div.className = 'flowchart';
    div.style.width = '400px';
    div.textContent = m[1];
    document.getElementById('wrap').appendChild(div);
  }
  document.querySelectorAll('.flowchart').forEach(function(el){
    try {
      var diagram = flowchart.parse(el.textContent);
      el.innerHTML = '';
      diagram.drawSVG(el, editorDefaults);
      var svg = el.querySelector('svg');
      console.log('FC#' + (el.style.width) + ' svg w=' + (svg && svg.getAttribute('width')) + ' h=' + (svg && svg.getAttribute('height')));
    } catch (e) { console.error('FC render error:', e); }
  });
  console.log('DONE');
});
</script>
</body>
</html>
