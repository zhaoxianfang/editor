<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>fc static test</title>
</head>
<body>
<div id="wrap" style="width:760px;margin:0 auto;"></div>
<script src="/lib/flowchart.bundle.min.js"></script>
<script>
var fcSource = null;
fetch('/examples/md/full.md').then(function(r){return r.text();}).then(function(md){
  // 提取所有 ```flow ... ``` 块
  var re = /```flow\s*\n([\s\S]*?)```/g, m, i = 0;
  while ((m = re.exec(md)) !== null) {
    i++;
    var div = document.createElement('div');
    div.className = 'flowchart';
    div.id = 'fc-' + i;
    div.style.width = '640px';
    div.style.margin = '20px auto';
    div.textContent = m[1];
    document.getElementById('wrap').appendChild(div);
  }
  // 逐个渲染
  document.querySelectorAll('.flowchart').forEach(function(el){
    try {
      var diagram = flowchart.parse(el.textContent);
      el.innerHTML = '';
      diagram.drawSVG(el, { 'line-width': 2, 'line-length': 40, 'text-margin': 8, 'font-size': 14, 'font': 'sans-serif' });
    } catch (e) {
      console.error('FC render error:', e);
    }
  });
  console.log('DONE rendered=' + i);
});
</script>
</body>
</html>
