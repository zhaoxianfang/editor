<!DOCTYPE html>
<html lang="zh">
    <head>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
        <meta charset="utf-8" />
        <title>Onchange - xfEditor examples</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="../css/xf_editor.min.css" />
    </head>
    <body>
        <div id="layout">
            <header>
                <h1>Onchange event</h1>   
                <p>Plaese press F12, open the develop tools.</p> 
                <p id="output"></p>    
            </header>
            <div id="test-xfEditor">                
                <textarea style="display:none;">#### Settings

```javascript
{
    onchange : function() {
        console.log("onchange =>", this, this.id, this.settings, this.state);
        // ....
    }
}
```
</textarea>
            </div>
        </div>        
        <script src="../xf_editor.min.js"></script>   
        <script type="text/javascript">var dom = (window.xfEditor && window.xfEditor.dom) ? window.xfEditor.dom : null; // 内置 micro-DOM（零依赖，无全局 $）

            var testEditor;
            
            dom(function() {
                testEditor = xfEditor("test-xfEditor", {
                    width  : "90%",
                    height : 720,
                    path   : '../lib/',
                    onchange : function() {
                        dom("#output").html("onchange : this.id =>" + this.id + ", markdown =>" + this.getValue());
                        console.log("onchange =>", this, this.id, this.settings, this.state);
                    }
                });
            });
        </script>
    </body>
</html>
