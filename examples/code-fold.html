<!DOCTYPE html>
<html lang="zh">
    <head>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
        <meta charset="utf-8" />
        <title>Code folding - xfEditor examples</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="../css/xf_editor.min.css" />
    </head>
    <body>
        <div id="layout">
            <header>
                <h1>Code folding</h1>
                <p>Switch code folding : Press Ctrl + Q / Command + Q</p>
            </header>
            <div id="test-xfEditor">
                <textarea style="display:none;"></textarea>
            </div>
        </div>
        <script src="../xf_editor.min.js"></script>
        <script type="text/javascript">var dom = (window.xfEditor && window.xfEditor.dom) ? window.xfEditor.dom : null; // 内置 micro-DOM（零依赖，无全局 $）

            var testEditor;
            
            dom(function() {
                dom.get("md/full.md", function(md) {
                    testEditor = xfEditor("test-xfEditor", {
                        width  : "90%",
                        height : 720,
                        markdown : "#### Setting\r\n\r\n    {\n        codeFold : true\n    }\r\n\r\n" + md,
                        codeFold : true,
                        htmlDecode : true,
                        tex : true,
                        taskList : true,

                        flowChart : true,
                        sequenceDiagram : true,
                        path   : '../lib/'
                    });
                });
            });
        </script>
    </body>
</html>
