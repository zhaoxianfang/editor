<!DOCTYPE html>
<html lang="zh">
    <head>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
        <meta charset="utf-8" />
        <title>HTML Preview(markdown to html) - xfEditor examples</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="../css/xf_editor.preview.min.css" />
        <style>            
            .xfEditor-html-preview {
                width: 90%;
                margin: 0 auto;
            }
        </style>
    </head>
    <body>
        <div id="layout">
            <header>
                <h1>Markdown转HTML的显示处理</h1> 
                <p>即：非编辑情况下的HTML预览</p>
                <p>HTML Preview(markdown to html)</p>       
            </header>
            <div class="btns">
                <button onclick="location.href='./html-preview-markdown-to-html-custom-toc-container.html';">将 ToC 移到自定义容器层</button>
            </div>
            <div id="test-xf_editor-view">
               <textarea style="display:none;" name="test-xf_editor-markdown-doc">###Hello world!</textarea>               
            </div>
            <div id="test-xf_editor-view2">
                <textarea id="append-test" style="display:none;">

###科学公式 TeX(KaTeX)
                    
$$E=mc^2$$

行内的公式$$E=mc^2$$行内的公式，行内的$$E=mc^2$$公式。

$$\(\sqrt{3x-1}+(1+x)^2\)$$
                    
$$\sin(\alpha)^{\theta}=\sum_{i=0}^{n}(x^i + \cos(f))$$

$$X^2 > Y$$

#####上标和下标

上标：X&lt;sup&gt;2&lt;/sup&gt;

下标：O&lt;sub&gt;2&lt;/sub&gt;

##### 代码块里包含的过滤标签及属性不会被过滤

```html
&lt;style type="text/style"&gt;
body{background:red;}
&lt;/style&gt;

&lt;script type="text/javscript"&gt;
alert("script");
&lt;/script&gt;

&lt;iframe height=498 width=510 src="http://vjs.zencdn.net/v/oceans.mp4" frameborder=0 allowfullscreen&gt;&lt;/iframe&gt;
```

#####Style

&lt;style&gt;
body{background:red;}
&lt;/style&gt;

&lt;style type="text/style"&gt;
body{background:red;}
&lt;/style&gt;

#####Script

&lt;script&gt;
alert("script");
&lt;/script&gt;

&lt;script type="text/javscript"&gt;
alert("script");
&lt;/script&gt;</textarea>          
            </div>
        </div>
        <script src="../lib/marked.min.js"></script>
        <script src="../lib/prettify.min.js"></script>
        <script src="../lib/raphael.min.js"></script>
        <script src="../lib/underscore.min.js"></script>
        <script src="../lib/sequence-diagram.min.js"></script>
        <script src="../lib/flowchart.min.js"></script>
        <script src="../xf_editor.min.js"></script>
        <script type="text/javascript">            var dom = (window.xfEditor && window.xfEditor.dom) ? window.xfEditor.dom : null; // 内置 micro-DOM（零依赖，无全局 $）
            
            dom(function() {
                var testXfEditorView, testXfEditorView2;
                
                dom.get("md/full.md", function(markdown) {
                    
				    testXfEditorView = xfEditor.markdownToHTML("test-xf_editor-view", {
                        markdown        : markdown ,//+ "\r\n" + dom("#append-test").text(),
                        //htmlDecode      : true,       // 开启 HTML 标签解析，为了安全性，默认不开启
                        htmlDecode      : "style,script,iframe",  // you can filter tags decode
                        //toc             : false,
                        tocm            : true,    // Using [TOCM]
                        //tocContainer    : "#custom-toc-container", // 自定义 ToC 容器层
                        //gfm             : false,
                        //tocDropdown     : true,
                        // markdownSourceCode : true, // 是否保留 Markdown 源码，即是否删除保存源码的 Textarea 标签

                        taskList        : true,
                        tex             : true,  // 默认不解析
                        flowChart       : true,  // 默认不解析
                        sequenceDiagram : true,  // 默认不解析
                        tooltip         : true,
                        echarts         : true,
                        tabs            : true,
                        columns         : true,
                        pinyin          : true,
                        textAlign       : true,
                        imageResize     : true,
                        pageBreak       : true,
                        atLink          : true,
                        copybook        : true,
                        path            : "../lib/",  // ★ 必须指定 path，否则依赖模块无法加载
                    });
                    
                    //console.log("返回一个 jQuery 实例 =>", testXfEditorView);
                    
                    // 获取Markdown源码
                    //console.log(testXfEditorView.getMarkdown());
                    
                    //alert(testXfEditorView.getMarkdown());
                });
                    
                testXfEditorView2 = xfEditor.markdownToHTML("test-xf_editor-view2", {
                    htmlDecode      : "style,script,iframe",  // you can filter tags decode

                    taskList        : true,
                    tex             : true,  // 默认不解析
                    flowChart       : true,  // 默认不解析
                    sequenceDiagram : true,  // 默认不解析
                    tooltip         : true,
                    echarts         : true,
                    tabs            : true,
                    columns         : true,
                    pinyin          : true,
                    textAlign       : true,
                    imageResize     : true,
                    pageBreak       : true,
                    atLink          : true,
                    copybook        : true,
                    path            : "../lib/",  // ★ 必须指定 path，否则依赖模块无法加载
                });
            });
        </script>
    </body>
</html>
