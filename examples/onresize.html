<!DOCTYPE html>
<html lang="zh">
    <head>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
        <meta charset="utf-8" />
        <title>Onresize - xfEditor examples</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="../css/xf_editor.min.css" />
    </head>
    <body>
        <div id="layout">
            <header>
                <h1>Onresize event handle</h1>
                <p>Plaese press F12, open the develop tools.</p>     
            </header>
            <div id="test-xfEditor">                
                <textarea style="display:none;">#### Settings

```javascript
{
    onresize : function() {
        // console.log("onresize =>", this, this.id, this.settings);
    }
}
```

    state.loaded
           > bind onresize event
               > window.onresize, xfEditor watch/unwatch/fullscreen/fullscreenExit/toolbar show|hide
                   > trigger onresize event handle</textarea>
            </div>
        </div>
        <script src="../xf_editor.min.js"></script>
        <script type="text/javascript">var dom = (window.xfEditor && window.xfEditor.dom) ? window.xfEditor.dom : null; // 内置 micro-DOM（零依赖，无全局 $）

            dom(function() {
                var testEditor = xfEditor("test-xfEditor", {
                    width  : "90%",
                    height : 720,
                    path   : '../lib/',
                    onresize : function() {
                        this.setMarkdown("state.loaded > bind onresize > window.onresize, xfEditor watch/unwatch/fullscreen/fullscreenExit/toolbar show|hide " + (new Date).getTime());
                        console.log("onresize =>", this, this.id, this.settings);
                    }
                });
            });
        </script>
    </body>
</html>
