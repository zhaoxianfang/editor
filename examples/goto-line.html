<!DOCTYPE html>
<html lang="zh">
    <head>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
        <meta charset="utf-8" />
        <title>Goto line - xfEditor examples</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="../css/xf_editor.min.css" />   
    </head>
    <body>
        <div id="layout">
            <header>
                <h1>Goto line</h1>   
            </header>
            <div class="btns">
                <button id="goto-line-btn">Goto line 90</button>
                <button id="goto-line-150-btn">Goto line 150</button>
                <button id="goto-line-240-btn">Goto line 240</button>
                <button id="goto-line-300-btn">Goto line 300</button>
                <button id="goto-line-400-btn">Goto line 400</button>
                <button id="goto-first-line-btn">Goto first line</button>
                <button id="goto-last-line-btn">Goto last line</button>
            </div>
            <div id="test-xfEditor"></div>
        </div>
        <script src="../xf_editor.min.js"></script>
        <script type="text/javascript">
            var testEditor;
            
            $(function() {
                
                $.get("md/full.md", function(md){
                    testEditor = xfEditor("test-xfEditor", {
                        width           : "90%",
                        height          : 740,
                        path            : "../lib/",
                        markdown        : md,
                        codeFold        : true,
                        htmlDecode      : "style,script,iframe",
                        tex             : true,

                        taskList        : true,
                        flowChart       : true,
                        sequenceDiagram : true,
                        //gotoLine        : false  // disabled
                    });
                });
                
                $("#goto-line-btn").on("click", function(){
                    testEditor.gotoLine(90);
                });
                
                $("#goto-line-150-btn").on("click", function(){
                    testEditor.gotoLine(150);
                });
                
                $("#goto-line-240-btn").on("click", function(){
                    testEditor.gotoLine(240);
                });
                
                $("#goto-line-300-btn").on("click", function(){
                    testEditor.gotoLine(300);
                });
                
                $("#goto-line-400-btn").on("click", function(){
                    testEditor.gotoLine(400);
                });
                
                $("#goto-first-line-btn").on("click", function(){
                    testEditor.gotoLine("first");
                    // or
                    //testEditor.gotoLine(1);
                });
                
                $("#goto-last-line-btn").on("click", function(){
                    testEditor.gotoLine("last");
                    // or
                    //testEditor.gotoLine(testEditor.cm.lineCount());
                });
            });
        </script>
    </body>
</html>
