<!DOCTYPE html>
<html lang="zh">
    <head>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
        <meta charset="utf-8" />
        <title>无外部 DOM 库（内置 micro-DOM）- xfEditor examples</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="../css/xf_editor.min.css" />
    </head>
    <body>
        <div id="layout">
            <header>
                <h1>不使用任何外部 DOM 库（内置 micro-DOM）</h1>
                <ul style="margin: 10px 0 0 18px;">
                    <li>Enable HTML tags decode</li>
                    <li>Enable TeX, Flowchart, Sequence Diagram, FontAwesome, Task lists</li>
                    <li>Enable Image upload</li>
                    <li>Enable [TOCM], Search Replace, Code fold</li>
                </ul>  
            </header>
            <div class="btns">
                <button id="show-btn">Show editor</button>
                <button id="hide-btn">Hide editor</button>
                <button id="get-md-btn">Get Markdown</button>
                <button id="get-html-btn">Get HTML</button>
                <button id="watch-btn">Watch</button>
                <button id="unwatch-btn">Unwatch</button>
                <button id="preview-btn">Preview HTML (Press Shift + ESC cancel)</button>
                <button id="fullscreen-btn">Fullscreen (Press ESC cancel)</button>
                <button id="show-toolbar-btn">Show toolbar</button>
                <button id="close-toolbar-btn">Hide toolbar</button>
                <button id="toc-menu-btn">ToC Dropdown menu</button>
                <button id="toc-default-btn">ToC default</button>
            </div>
            <form action="./php/post.php" method="post">
                <div class="xf_editor" id="test-xfEditor">                
                    <textarea>### Hello world!</textarea>
                </div>
                <br/><input type="submit" name="submit" value="Submit" class="btn" style="margin-left: 5%;" />
            </form>
        </div>        
        <script src="../xf_editor.min.js"></script>   
        <script type="text/javascript">
			var testEditor;
            // xfEditor 已内置零依赖 micro-DOM（xfEditor.dom / xfEditor.$），
            // 无需加载 Zepto / jQuery 即可运行；页面未引入外部 $ 时浏览器全局 $ 自动指向内置 DOM。
            var $ = (typeof window.xfEditor !== "undefined" && window.xfEditor.dom) ? window.xfEditor.dom : window.$;

            $(function() {
                $.get("md/full.md", function(md){
				testEditor = xfEditor("test-xfEditor", {
						width  : "90%",
						height : 720,
						path   : '../lib/',
						markdown : md,
                        codeFold : true,
                        searchReplace : true,
                        saveHTMLToTextarea : true,    // 保存 HTML 到 Textarea
                        //watch : false,
                        htmlDecode : "style,script,iframe|on*",            // 开启 HTML 标签解析，为了安全性，默认不开启

                        taskList : true,
                        tocm            : true,         // Using [TOCM]
                        tex : true,                     // 开启科学公式 TeX 语言支持，默认关闭
                        //previewCodeHighlight : false,  // 关闭预览窗口的代码高亮，默认开启
                        flowChart : true,  
                        sequenceDiagram : true,         // 同上
						onload : function() {
							console.log("onload =>", this, this.id, this.settings);
						}
					});
				});

                $("#show-btn").on('click', function(){
                    testEditor.show();
                });

                $("#hide-btn").on('click', function(){
                    testEditor.hide();
                });

                $("#get-md-btn").on('click', function(){
                    alert(testEditor.getMarkdown());
                });

                $("#get-html-btn").on('click', function() {
                    alert(testEditor.getHTML());
                });                

                $("#watch-btn").on('click', function() {
                    testEditor.watch();
                });                 

                $("#unwatch-btn").on('click', function() {
                    testEditor.unwatch();
                });              

                $("#preview-btn").on('click', function() {
                    testEditor.previewing();
                });

                $("#fullscreen-btn").on('click', function() {
                    testEditor.fullscreen();
                });
                
                $("#show-toolbar-btn").on('click', function() {
                    testEditor.showToolbar();
                });
                
                $("#close-toolbar-btn").on('click', function() {
                    testEditor.hideToolbar();
                });
                
                $("#toc-menu-btn").click(function(){
                    testEditor.config({
                        tocDropdown   : true,
                        tocTitle      : "目录 Table of Contents",
                    });
                });
                
                $("#toc-default-btn").click(function() {
                    testEditor.config("tocDropdown", false);
                });
            });
        </script>
    </body>
</html>
