<!DOCTYPE html>
<html lang="zh">
    <head>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
        <meta charset="utf-8" />
        <title>External use - xfEditor examples</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="../css/xf_editor.min.css" />
    </head>
    <body>
        <div id="layout">
            <header>
                <h1>External use</h1> 
                <p>External use of toolbar handlers / modal dialog</p>
            </header>
            <div class="btns">
                <button id="undo">Undo</button>
                <button id="open-link-dialog">Open link dialog</button>
                <button id="insert-bold">Insert Bold</button>
                <button id="insert-h6">Insert Heading 6</button>
                <button id="insert-inline-code">Insert Inline code</button>
                <button id="open-image-dialog">Open image dialog</button>
                <button id="open-help-dialog">Open help dialog</button>
                <button id="open-html-entities-dialog">Open html entities dialog</button>
            </div>
            <div id="test-xfEditor">                
                <textarea style="display:none;">[TOC]

### External use of toolbar handlers / modal dialog

```javascript 
testEditor = xfEditor("test-xfEditor", {
    width  : "90%",
    height : 720,
    path   : '../lib/'
}); 

// the first method
$("#undo").on('click', function() {
    $.proxy(testEditor.toolbarHandlers.undo, testEditor)();
});

// the Second method : using manually loaded dialog plugin
// &lt;script src="../plugins/html-entities/html-entities.js"&gt;&lt;/script&gt;
$("#open-html-entities-dialog").on('click', function() {
    testEditor.htmlEntities();
});

// using toolbar dialog plugin
$("#open-link-dialog").on('click', function() {
    $.proxy(testEditor.toolbarHandlers.link, testEditor)();
});

// or
$("#open-image-dialog").on('click', function(){
    // load and execute plugin
    testEditor.executePlugin("imageDialog", "../plugins/image-dialog/image-dialog");
});
```
</textarea>
            </div>
        </div>        
        <script src="../xf_editor.min.js"></script>
        
        <!-- manually load dialog plugin -->
        <script src="../plugins/html-entities-dialog/html-entities-dialog.js"></script>
        <script type="text/javascript">var dom = (window.xfEditor && window.xfEditor.dom) ? window.xfEditor.dom : null; // 内置 micro-DOM（零依赖，无全局 $）

            var testEditor;
            
            dom(function() {             
                testEditor = xfEditor("test-xfEditor", {
                    width  : "90%",
                    height : 720,
                    path   : '../lib/'
                }); 
                
                // the first method
                dom("#undo").on('click', function() {
                    dom.proxy(testEditor.toolbarHandlers.undo, testEditor)();
                });
                
                // the Second method : using manually loaded dialog plugin
                dom("#open-html-entities-dialog").on('click', function() {
                    testEditor.htmlEntitiesDialog();
                });
                
                dom("#insert-bold").on('click', function() {
                    dom.proxy(testEditor.toolbarHandlers.bold, testEditor)();
                    testEditor.focus();
                });
                
                dom("#insert-h6").on('click', function() {
                    dom.proxy(testEditor.toolbarHandlers.h6, testEditor)();
                    testEditor.focus();
                });
                
                dom("#insert-inline-code").on('click', function() {
                    dom.proxy(testEditor.toolbarHandlers.code, testEditor)();
                    testEditor.focus();
                });                
                
                dom("#open-help-dialog").on('click', function() {
                    dom.proxy(testEditor.toolbarHandlers.help, testEditor)();
                });
                
                // using toolbar dialog plugin
                dom("#open-link-dialog").on('click', function() {
                    dom.proxy(testEditor.toolbarHandlers.link, testEditor)();
                });
                
                // or
                dom("#open-image-dialog").on('click', function(){
                    testEditor.executePlugin("imageDialog", "../plugins/image-dialog/image-dialog"); // load and execute plugin
                });
            });
        </script>
    </body>
</html>
