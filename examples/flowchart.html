<!DOCTYPE html>
<html lang="zh">
    <head>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
        <meta charset="utf-8" />
        <title>FlowChart - xfEditor examples</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="../css/xf_editor.min.css" />
    </head>
    <body>
        <div id="layout">
            <header>
                <h1>FlowChart 流程图</h1>
                <p>Based on flowchart.js：<a href="http://adrai.github.io/flowchart.js/" target="_blank">http://adrai.github.io/flowchart.js/</a></p>        
            </header>
            <div id="test-xfEditor">
                <textarea style="display:none;">#### Using FlowChart

setting:

    {
        flowChart : true
    }

#### Example

```flow
st=>start: User login
op=>operation: Operation
cond=>condition: Successful Yes or No?
e=>end: Into admin

st->op->cond
cond(yes)->e
cond(no)->op
```</textarea>
            </div>
        </div>
        
        <script src="../xf_editor.min.js"></script>   
        <script type="text/javascript">
            $(function() {       
                var testEditor = xfEditor("test-xfEditor", {
					width: "90%",
					height: 640,
					path : '../lib/',
					flowChart : true
				});
            });
        </script>
    </body>
</html>
