<!DOCTYPE html>
<html lang="zh">
    <head>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
        <meta charset="utf-8" />
        <title>Using require.js - xfEditor examples</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="../lib/codemirror/codemirror.min.css" /> 
        <!-- <link rel="stylesheet" href="../lib/codemirror/addon/fold/foldgutter.css" /> -->
        <link rel="stylesheet" href="../css/xf_editor.min.css" />
    </head>
    <body>
        <div id="layout">
            <header>
                <h1>Using require.js</h1>
                <ul style="margin: 10px 0 0 18px;">
                    <li>Enable HTML tags decode</li>
                    <li>Enable TeX, Flowchart, Sequence Diagram, FontAwesome, Task lists</li>
                    <li>Enable Image upload</li>
                    <li>Enable [TOCM], Search Replace, Code fold</li>
                </ul>        
            </header>
            <div class="btns">
                <button id="show-btn">Show editor</button>
                <button id="hide-btn">Hide editor</button>
                <button id="get-md-btn">Get Markdown</button>
                <button id="get-html-btn">Get HTML</button>
                <button id="watch-btn">Watch</button>
                <button id="unwatch-btn">Unwatch</button>
                <button id="preview-btn">Preview HTML (Press Shift + ESC cancel)</button>
                <button id="fullscreen-btn">Fullscreen (Press ESC cancel)</button>
                <button id="show-toolbar-btn">Show toolbar</button>
                <button id="close-toolbar-btn">Hide toolbar</button>
                <button id="toc-menu-btn">ToC Dropdown menu</button>
                <button id="toc-default-btn">ToC default</button>
            </div>
            <div id="test-xfEditor"></div>
        </div>   
        <script src="js/require.min.js"></script>
        <script type="text/javascript">            
            requirejs.config({
                baseUrl: "../lib/",
                paths: {
                    marked          : "marked.min",
                    prettify        : "prettify.min",
                    raphael         : "raphael.min",
                    underscore      : "underscore.min",
                    flowchart       : "flowchart.min", 
                    sequenceDiagram : "sequence-diagram.min",
                    katex           : "../lib/katex/katex.min",
                    xf_editor       : "../xf_editor.amd" // Using xfEditor amd version for Require.js
                },
                // 插件/语言包内部按历史模块名 "xfEditor" 声明依赖，
                // 用 map 把它统一重定向到 xf_editor（保证只实例化一份编辑器模块）。
                map: {
                    "*": { xfEditor : "xf_editor" }
                },
                // raphael / flowchart / sequence-diagram 均为 UMD：在 AMD 环境下它们会
                // 注册为匿名模块而不再挂到 window，导致 sequence-diagram 找不到 Raphael。
                // 用 shim 声明依赖顺序并导出为全局，保证互相可见。
                shim: {
                    raphael         : { exports : "Raphael" },
                    underscore      : { exports : "_" },
                    flowchart       : { deps : ["raphael"], exports : "flowchart" },
                    sequenceDiagram : { deps : ["raphael", "underscore"], exports : "Diagram" },
                    prettify        : { exports : "prettyPrint" }
                },
                waitSeconds: 30
            });
            
            var deps = [
                "raphael",
                "underscore",
                "flowchart",
                "sequenceDiagram",
                "xf_editor", 
                "../languages/en", 
                "../plugins/link-dialog/link-dialog",
                "../plugins/reference-link-dialog/reference-link-dialog",
                "../plugins/image-dialog/image-dialog",
                "../plugins/code-block-dialog/code-block-dialog",
                "../plugins/table-dialog/table-dialog",

                "../plugins/goto-line-dialog/goto-line-dialog",
                "../plugins/help-dialog/help-dialog",
                "../plugins/html-entities-dialog/html-entities-dialog", 
                "../plugins/preformatted-text-dialog/preformatted-text-dialog"
            ];
            
            var testEditor;
                
            require(deps, function(Raphael, _, flowchart, Diagram, xfEditor) {

                // 模块加载器环境下不会走全局导出分支，
                // 这里直接取编辑器内置的 micro-DOM 作为本页的 $（无需 jQuery）
                var $ = xfEditor.dom;
                
                // if enable codeFold
                // or <link rel="stylesheet" href="../lib/codemirror/addon/fold/foldgutter.css" />
                xfEditor.loadCSS("../lib/codemirror/addon/fold/foldgutter");
                
                // 使用编辑器内置 micro-DOM 的 AJAX，无需 jQuery
                xfEditor.dom.get('md/full.md', function(md) {
                    testEditor = xfEditor("test-xfEditor", {
                        width: "90%",
                        height: 640,
                        path : '../lib/',
                        markdown : md,
                        codeFold : true,
                        searchReplace : true,
                        saveHTMLToTextarea : true,                // 保存HTML到Textarea
                        htmlDecode : "style,script,iframe|on*",       // 开启HTML标签解析，为了安全性，默认不开启    

                        taskList : true,
                        tex : true,
                        tocm            : true,         // Using [TOCM]
                        autoLoadModules : false,
                        previewCodeHighlight : true,
                        flowChart : true,
                        sequenceDiagram : true,
                        //dialogLockScreen : false,   // 设置弹出层对话框不锁屏，全局通用，默认为true
                        //dialogShowMask : false,     // 设置弹出层对话框显示透明遮罩层，全局通用，默认为true
                        //dialogDraggable : false,    // 设置弹出层对话框不可拖动，全局通用，默认为true
                        //dialogMaskOpacity : 0.4,    // 设置透明遮罩层的透明度，全局通用，默认值为0.1
                        //dialogMaskBgColor : "#000", // 设置透明遮罩层的背景颜色，全局通用，默认为#fff
                        imageUpload : true,
                        imageFormats : ["jpg", "jpeg", "gif", "png", "bmp", "webp"],
                        imageUploadURL : "./php/upload.php",
                        onload : function() {
                            console.log('onload', this);
                            //this.fullscreen();
                            //this.unwatch();
                            //this.watch().fullscreen();

                            //this.setMarkdown("#PHP");
                            //this.width("100%");
                            //this.height(480);
                            //this.resize("100%", 640);
                        }
                    });
                });

                $("#show-btn").on('click', function(){
                    testEditor.show();
                });

                $("#hide-btn").on('click', function(){
                    testEditor.hide();
                });

                $("#get-md-btn").on('click', function(){
                    alert(testEditor.getMarkdown());
                });

                $("#get-html-btn").on('click', function() {
                    alert(testEditor.getHTML());
                });                

                $("#watch-btn").on('click', function() {
                    testEditor.watch();
                });                 

                $("#unwatch-btn").on('click', function() {
                    testEditor.unwatch();
                });              

                $("#preview-btn").on('click', function() {
                    testEditor.previewing();
                });

                $("#fullscreen-btn").on('click', function() {
                    testEditor.fullscreen();
                });

                $("#show-toolbar-btn").on('click', function() {
                    testEditor.showToolbar();
                });

                $("#close-toolbar-btn").on('click', function() {
                    testEditor.hideToolbar();
                });
                
                $("#toc-menu-btn").click(function(){
                    testEditor.config({
                        tocDropdown   : true,
                        tocTitle      : "目录 Table of Contents",
                    });
                });
                
                $("#toc-default-btn").click(function() {
                    testEditor.config("tocDropdown", false);
                });
            });
        </script>
    </body>
</html>
